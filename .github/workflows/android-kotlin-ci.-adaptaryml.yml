name: Android Kotlin CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Build, Lint & Unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Set up Gradle (with build cache)
      uses: gradle/actions/setup-gradle@v3

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          platforms;android-34
          build-tools;34.0.0

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Download dependencies
      run: ./gradlew --no-daemon --stacktrace dependencies || true

    - name: Assemble Debug
      run: ./gradlew --no-daemon --stacktrace clean assembleDebug

    - name: Static analysis & Lint (runs everything configured)
      run: ./gradlew --no-daemon --stacktrace check lint

    - name: Unit tests (with XML reports)
      run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

    - name: Generate code coverage (if JaCoCo configured)
      run: ./gradlew --no-daemon --stacktrace jacocoTestReport || echo "JaCoCo not configured, skipping"
      # If you want to fail on low coverage, wire up jacocoTestCoverageVerification in your build.gradle and add it to the check lifecycle.

    - name: Upload build/test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-build-and-unit-tests
        path: |
          **/build/reports/**
          **/build/test-results/**
          **/build/outputs/**

  instrumentation-tests:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/src/androidTest/**') != '' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Set up Gradle (with build cache)
      uses: gradle/actions/setup-gradle@v3

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          platforms;android-34
          system-images;android-34;google_apis;x86_64
          build-tools;34.0.0

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Start emulator and run connected tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

    - name: Upload instrumented test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-instrumentation-tests
        path: |
          **/build/reports/**
          **/build/outputs/androidTest-results/**